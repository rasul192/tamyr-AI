name: Tamyr AI Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib pytest
        pip install -r requirements.txt
        pip install pytest

    - name: Run Thermodynamic Unit Tests
      run: |
        pytest tests/ -v

    - name: Verify Full Reproduction Pipeline
      run: |
        python src/tamyr_ablation_study.py
        python src/tamyr_vtk_export.py
        python src/tamyr_pde_boundary_layer.py
    - name: Verify Core Simulation Scripts
      run: |
        python src/tamyr_pde_boundary_layer.py
        python src/tamyr_vtk_export.py
        python src/tamyr_ablation_study.py
        python src/tamyr_intervention_sim.py
    - name: Verify Core Simulation Scripts
      run: |
        python src/tamyr_pde_boundary_layer.py
        python src/tamyr_vtk_export.py
        python src/tamyr_ablation_study.py
        python src/tamyr_intervention_sim.py
        python src/tamyr_multisite_otrar.py
    - name: Verify Core Simulation Scripts
      run: |
        python src/tamyr_pde_boundary_layer.py
        python src/tamyr_vtk_export.py
        python src/tamyr_ablation_study.py
        python src/tamyr_intervention_sim.py
        python src/tamyr_multisite_otrar.py
        python src/tamyr_monte_carlo_uq.py        
    - name: Verify Core Simulation Scripts
      run: |
        python src/tamyr_pde_boundary_layer.py
        python src/tamyr_vtk_export.py
        python src/tamyr_ablation_study.py
        python src/tamyr_intervention_sim.py
        python src/tamyr_multisite_otrar.py
        python src/tamyr_monte_carlo_uq.py
        python src/tamyr_data_assimilation_ekf.py    
        
